<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenCard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e3a5f;
      --accent: #f97316;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 20px;      
    }

    /* Caixa do Seletor de Cores */
    .color-picker-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: -10px;
    }

    .color-picker-box span {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .color-options {
      display: flex;
      gap: 8px;
    }

    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .color-btn:hover, .color-btn.active {
      transform: scale(1.25);
      border-color: #ffffff;
    }

    /* Cartão Estilizado */
    .business-card {
      background: linear-gradient(135deg, #1b355a 0%, #10223b 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .logo-symbol {
      width: 68px;
      height: auto;
      margin-bottom: 20px;
    }

    .name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .title {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Botões de Ação */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.1s ease, opacity 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Botão Principal: Download VCF */
    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }

    /* Botões Secundários */
    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.14);
    }

    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

      .tip-box {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: #ffedd5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
    }

  .tip-box svg {
    color: var(--accent);
   flex-shrink: 0;
  }

  .tip-box strong {
    color: #ffffff;
  }
  </style>
</head>
<body>

  <div class="container">

    <!-- Seletor de Cores (Demonstração Interativa) -->
    <div class="color-picker-box">
      <span>Teste as cores:</span>
      <div class="color-options">
        <button class="color-btn active" style="background: #f97316;" onclick="changeTheme('#f97316', '#1b355a', '#10223b')" title="Laranja Original"></button>
        <button class="color-btn" style="background: #3b82f6;" onclick="changeTheme('#3b82f6', '#1e293b', '#0f172a')" title="Azul Profissional"></button>
        <button class="color-btn" style="background: #10b981;" onclick="changeTheme('#10b981', '#064e3b', '#022c22')" title="Verde Saúde"></button>
        <button class="color-btn" style="background: #a855f7;" onclick="changeTheme('#a855f7', '#3b0764', '#1e1b4b')" title="Roxo Moderno"></button>
        <button class="color-btn" style="background: #e11d48;" onclick="changeTheme('#e11d48', '#4c0519', '#1f040a')" title="Vermelho Premium"></button>
      </div>
    </div>

    <!-- Visualização do Cartão -->
    <div class="business-card" id="card">
      <!-- Substitua src pelo link do seu arquivo SVG ou PNG da logo -->
      <img class="logo-symbol" src="exemplo.png" alt="Exemplo" style="width: 130px; height: 130px; border-radius: 50%;" onerror="this.style.display='none'">
      <h1 class="name">Seu nome aqui</h1>
      <p class="title">Subtítulo</p>
    </div>

    <!-- Aviso geral de simulação -->
    <div style="background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 12px 16px; margin: 16px 0; text-align: center;">
      <p style="font-size: 0.82rem; color: #94a3b8; line-height: 1.4;">
        💡 <strong style="color: #38bdf8;">Cartão de Demonstração:</strong> Os botões abaixo são exemplos. No seu Screen Card oficial, tudo será personalizado com os seus dados e links.
      </p>
    </div>
    <!-- Links e Ações -->
    <div class="actions">
      <!-- Gera o contato direto na agenda -->
      <button class="btn btn-primary" onclick="generateVCard()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7.5" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        Salvar na Agenda
      </button>

      <!-- Mensagem direta -->
      <a class="btn btn-secondary" href="https://wa.me/5538997540343?text=Olá!%20Teste%20o%20cartão%20de%20e%20gostaria%20de%20pedir%20um%20para%20mim.">
        Conversar no WhatsApp
      </a>

      <!-- Landing Page / Site -->
      <a class="btn btn-secondary" href="CardapioExample.html">
        Serviços
      </a>

      <!-- Currículo Lattes / Acadêmico -->
      <a class="btn btn-secondary" href="https://www.instagram.com/" target="_blank" rel="noopener">
        Instagram
      </a>

      <!-- Currículo Lattes / Acadêmico -->
      <a class="btn btn-secondary" href="sobre.html" target="_blank" rel="noopener">
        Sobre
      </a>

      <!-- Botão Compartilhar -->
      <button class="btn btn-secondary" id="btn-compartilhar">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          Compartilhar Cartão
      </button>  
    </div>

    <!-- Dica de instrução -->
    <div class="tip-box">
      <button class="btn btn-secondary" onclick="generateVCard()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Toque em <strong>"Salvar na Agenda"</strong> para baixar o contato. Toque em OK para confirmar.</span>
      </button>
    </div>
  

  <script>
    function generateVCard() {
      // Configure aqui seus dados cadastrais exatos
      const contactData = {
        name: "Seu nome aqui",
        firstName: "Seu nome",
        lastName: "Seu sobrenome",
        org: "Sua organização",
        title: "Seu cargo",
        phone: "+553800000000", // Coloque seu DDI + DDD + Número
        email: "seu_email@dominio.com",
        url: "https://seusite.com.br"
      };

      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${contactData.lastName};${contactData.firstName};;;`,
        `FN:${contactData.name}`,
        `ORG:${contactData.org}`,
        `TITLE:${contactData.title}`,
        `TEL;TYPE=CELL,VOICE:${contactData.phone}`,
        `EMAIL;TYPE=WORK,INTERNET:${contactData.email}`,
        `URL:${contactData.url}`,
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `${contactData.firstName}_Contato.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Função para alterar as cores em tempo real
    function changeTheme(accentColor, cardBgStart, cardBgEnd) {
      // Altera a cor de destaque (botão principal)
      document.documentElement.style.setProperty('--accent', accentColor);
      
      // Altera o gradiente do cartão
      const card = document.getElementById('card');
      if (card) {
        card.style.background = `linear-gradient(135deg, ${cardBgStart} 0%, ${cardBgEnd} 100%)`;
      }

      // Destaca a bolinha selecionada
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.target) {
        event.target.classList.add('active');
      }
    }
  </script>
</body>
</html>
